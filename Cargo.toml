[package]
name = "urlshortener"
version = "0.1.0"
edition = "2024"

[dependencies]
# >=1.0.104 for RUSTSEC-2026-0190 (unsoundness in Error::downcast_mut).
anyhow = "1.0.104"
axum = { version = "0.8.4", features = ["macros"] }
axum-client-ip = "1.1.3"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
chrono = "0.4.41"
# Maintained fork of `dotenv`, which is unmaintained (RUSTSEC-2021-0141).
dotenvy = "0.15.7"
http = "1.3.1"
# >=0.9.3 for RUSTSEC-2026-0097 (unsoundness when a custom logger uses rand::rng).
rand = "0.9.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_yaml = "0.9.34"
# Round function for the Feistel permutation behind short codes. Must be a
# stable PRF: a hash that changed between releases would change the permutation
# and let the counter reissue a code it had already spent.
sha2 = "0.10.9"
tokio = { version = "1.45.0", features = ["full"] }
tower_governor = { version = "0.8.0", default-features = false, features = [
    "axum",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "json",
    "fmt",
] }
ua-parser = "0.2.1"
url = "2.5.7"
utoipa = "5.4.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
ydb = "0.10.1"
# Pinned exactly: ydb 0.10.x does not compile against ydb-grpc 0.2.1+, which
# added proto fields (topic metrics_level, InitRequest partition_max_in_flight_bytes,
# scheme entry ResourcePool/Transfer/SysView) that ydb never initializes or matches.
# Cargo unifies this with ydb's own ydb-grpc, so a caret range breaks the build.
# Unpin only when upgrading ydb (0.17.0 is current).
ydb-grpc = "=0.2.0"
